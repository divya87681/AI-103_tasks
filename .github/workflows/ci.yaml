
name: ai103-validation

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Python tests
        run: python -m pytest -v

      - name: Validate YAML configuration
        run: |
          python -c "import yaml; from pathlib import Path; p=Path('config/settings.example.yaml'); d=yaml.safe_load(p.read_text(encoding='utf-8-sig')); assert d['project']['status']=='NOT_VERIFIED'; assert d['project']['live_azure_calls_approved'] is False; assert d['azure']['resource_group']; assert d['azure']['location']; print('YAML validation PASSED')"

      - name: Validate Day-03 Custom Vision configuration
        run: |
          python -c "import yaml; from pathlib import Path; p=Path('Day-03/config.example.yaml'); d=yaml.safe_load(p.read_text(encoding='utf-8-sig')); assert d['service']['name']=='azure-custom-vision'; assert d['service']['verification_status']=='NOT_VERIFIED'; assert d['service']['adapter']=='mock'; assert d['security']['live_azure_calls_approved'] is False; assert set(d['classification']['labels']) == {'laptop','keyboard','mouse'}; print('Day-03 YAML validation PASSED')"

      - name: Set up Azure CLI
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az version
            az bicep install
            az bicep version

      - name: Build Bicep template
        run: az bicep build --file infra/main.bicep

# Deployment intentionally excluded until approval and authentication setup.
